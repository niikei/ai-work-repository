name: Feature request
description: Propose a focused improvement
title: "feat: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow is difficult today?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe the result without prescribing an implementation.
    validations:
      required: true
  - type: textarea
    id: considerations
    attributes:
      label: UX and edge cases
      description: Consider human UX, AI UX, operations, compatibility, and corner cases.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
