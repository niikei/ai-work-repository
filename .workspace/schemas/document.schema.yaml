version: 3
title_source: first_h1
inbox_root: 00-inbox
templates_root: 90-templates
required:
  - type
  - id
  - status
  - created
  - updated
  - related
types:
  log:
    root: 10-log
    statuses: [recorded]
    required: [date]
  project:
    root: 20-projects
    statuses: [planned, active, blocked, completed, cancelled]
    required: [health]
    values:
      health: [unknown, green, amber, red]
  area:
    root: 30-areas
    statuses: [active, paused, retired]
    required: [health, review_cycle, last_reviewed]
    values:
      health: [unknown, green, amber, red]
      review_cycle: [weekly, monthly, quarterly, annual]
  role:
    root: 40-library/10-roles
    statuses: [draft, active, retired]
  system:
    root: 40-library/20-systems
    statuses: [draft, active, retired]
  process:
    root: 40-library/30-processes
    statuses: [draft, active, retired]
  reference:
    root: 40-library/40-references
    statuses: [draft, active, retired]
artifact:
  roots: [20-projects, 30-areas]
  statuses: [draft, active, final, superseded]
  kinds:
    - weekly-report
    - report
    - analysis
    - specification
    - deliverable
    - attachment-note
    - note
  required: [type, id, kind, status, created, updated, related]
