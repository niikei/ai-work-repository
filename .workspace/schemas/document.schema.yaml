version: 4
title_source: first_h1
inbox_root: 00-inbox
templates_root: 90-templates
archive_root: 80-archive
required:
  - type
  - id
  - status
  - created
  - updated
  - related
types:
  log:
    root: 10-log
    statuses: [recorded]
    required: [date]
    optional: []
  project:
    root: 20-projects
    archive: projects
    statuses: [planned, active, blocked, completed, cancelled]
    required: [health]
    optional: []
    values:
      health: [unknown, green, amber, red]
  area:
    root: 30-areas
    archive: areas
    statuses: [active, paused, retired]
    required: [health, review_cycle, last_reviewed]
    optional: [group]
    values:
      health: [unknown, green, amber, red]
      review_cycle: [weekly, monthly, quarterly, annual]
  system:
    root: 40-library/10-catalog/systems
    archive: library/catalog/systems
    statuses: [draft, active, retired]
    optional: []
  role:
    root: 40-library/10-catalog/roles
    archive: library/catalog/roles
    statuses: [draft, active, retired]
    optional: []
  organization:
    root: 40-library/10-catalog/organizations
    archive: library/catalog/organizations
    statuses: [draft, active, retired]
    optional: []
  service:
    root: 40-library/10-catalog/services
    archive: library/catalog/services
    statuses: [draft, active, retired]
    optional: []
  process:
    root: 40-library/20-playbooks/processes
    archive: library/playbooks/processes
    statuses: [draft, active, retired]
    optional: []
  procedure:
    root: 40-library/20-playbooks/procedures
    archive: library/playbooks/procedures
    statuses: [draft, active, retired]
    optional: []
  control:
    root: 40-library/20-playbooks/controls
    archive: library/playbooks/controls
    statuses: [draft, active, retired]
    optional: []
  standard:
    root: 40-library/20-playbooks/standards
    archive: library/playbooks/standards
    statuses: [draft, active, retired]
    optional: []
  concept:
    root: 40-library/30-knowledge/concepts
    archive: library/knowledge/concepts
    statuses: [draft, active, retired]
    optional: []
  guide:
    root: 40-library/30-knowledge/guides
    archive: library/knowledge/guides
    statuses: [draft, active, retired]
    optional: []
  glossary:
    root: 40-library/30-knowledge/glossary
    archive: library/knowledge/glossary
    statuses: [draft, active, retired]
    optional: []
  resource:
    root: 40-library/40-resources
    archive: library/resources
    statuses: [draft, active, retired]
    optional: []
artifact:
  roots: [20-projects, 30-areas]
  statuses: [draft, active, final, superseded]
  kinds:
    - weekly-report
    - report
    - analysis
    - specification
    - deliverable
    - attachment-note
    - note
    - review
    - control
    - external-resource
  required: [type, id, kind, status, created, updated, related]
  optional:
    - period_start
    - period_end
    - provider
    - url
    - owner
    - access
    - last_verified
