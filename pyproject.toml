[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-work-repository"
version = "0.5.0"
description = "Validation and indexing tools for an AI-ready work repository"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "markdown-it-py>=4.0.0",
    "pyyaml>=6.0.2",
    "tzdata>=2025.2; sys_platform == 'win32'",
]

[project.scripts]
workrepo = "workrepo.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.17.0",
    "pytest>=8.4.0",
    "ruff>=0.16.1",
    "rumdl>=0.2.47",
    "types-pyyaml>=6.0.12.20250516",
]

[tool.hatch.build.targets.wheel]
packages = ["src/workrepo"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",
    "CPY001",
    "D",
    "T201",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.rumdl]
line-length = 100
# Copilot instruction, prompt, and agent files use YAML frontmatter without requiring an H1.
disable = ["MD041"]
extend-enable = ["MD060"]

[tool.rumdl.MD060]
style = "compact"

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["workrepo"]
